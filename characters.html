<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Chat • Jai's Fun Stuff</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #060a14;
      color: #eef2ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #07101f 0%, #070b17 100%);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 28px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      gap: 18px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .topbar a {
      color: #8fb7ff;
      text-decoration: none;
      font-weight: 600;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px;
    }

    .content {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 28px;
    }

    .sidebar {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 24px;
      height: fit-content;
    }

    .sidebar h2 {
      margin: 0 0 18px;
      font-size: 1rem;
      color: #eef2ff;
    }

    .character-list {
      display: grid;
      gap: 10px;
      max-height: 500px;
      overflow-y: auto;
    }

    .character-item {
      padding: 12px;
      background: rgba(79, 155, 255, 0.08);
      border: 2px solid rgba(79, 155, 255, 0.2);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .character-item:hover {
      background: rgba(79, 155, 255, 0.15);
      border-color: rgba(79, 155, 255, 0.4);
    }

    .character-item.selected {
      background: rgba(79, 155, 255, 0.25);
      border-color: rgba(79, 155, 255, 0.6);
    }

    .character-emoji {
      font-size: 1.8rem;
      margin-bottom: 4px;
    }

    .character-name {
      font-weight: 700;
      font-size: 0.9rem;
      margin: 0;
    }

    .add-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, rgba(79, 155, 255, 0.2), rgba(14, 212, 199, 0.15));
      border: 2px dashed rgba(79, 155, 255, 0.4);
      color: #8fb7ff;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }

    .add-btn:hover {
      background: linear-gradient(135deg, rgba(79, 155, 255, 0.3), rgba(14, 212, 199, 0.25));
      border-color: rgba(79, 155, 255, 0.6);
    }

    .main-area {
      display: grid;
      gap: 18px;
      grid-template-rows: auto auto 1fr auto auto;
    }

    .controls {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
      display: grid;
      gap: 14px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .control-row.full {
      grid-template-columns: 1fr;
    }

    .control-item label {
      display: block;
      font-size: 0.85rem;
      color: #a8b7ff;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .control-item select {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #eef2ff;
      font: inherit;
      cursor: pointer;
    }

    .control-item select:focus {
      outline: none;
      border-color: rgba(79, 155, 255, 0.5);
    }

    .start-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #4f9bff, #0ed4c7);
      border: none;
      border-radius: 10px;
      color: #070b17;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .start-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(79, 155, 255, 0.4);
    }

    .start-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .topic-input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #eef2ff;
      font: inherit;
    }

    .topic-input:focus {
      outline: none;
      border-color: rgba(79, 155, 255, 0.5);
    }

    .chat-display {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px;
      min-height: 400px;
      display: flex;
      flex-direction: column;
    }

    .message-list {
      flex: 1;
      overflow-y: auto;
      display: grid;
      gap: 12px;
      padding-right: 4px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .message-speaker {
      font-weight: 700;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }

    .message.char1 {
      background: rgba(79, 155, 255, 0.15);
      border-left: 4px solid rgba(79, 155, 255, 0.5);
    }

    .message.char2 {
      background: rgba(106, 190, 205, 0.15);
      border-left: 4px solid rgba(106, 190, 205, 0.5);
    }

    .message.char3 {
      background: rgba(167, 139, 250, 0.15);
      border-left: 4px solid rgba(167, 139, 250, 0.5);
    }

    .message.loading {
      opacity: 0.7;
      font-style: italic;
    }

    .controls-bottom {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .stop-btn {
      padding: 10px 16px;
      background: rgba(255, 107, 107, 0.2);
      border: 1px solid rgba(255, 107, 107, 0.4);
      color: #ff9b9b;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .stop-btn:hover {
      background: rgba(255, 107, 107, 0.3);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: grid;
      place-items: center;
      z-index: 5000;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: linear-gradient(135deg, rgba(7, 11, 23, 0.98), rgba(14, 20, 40, 0.95));
      border: 1px solid rgba(79, 155, 255, 0.2);
      border-radius: 20px;
      padding: 28px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .modal-header h3 {
      margin: 0 0 20px;
      font-size: 1.3rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #c5d0ff;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #eef2ff;
      font: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: rgba(79, 155, 255, 0.5);
    }

    .modal-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-btn {
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-btn.primary {
      background: linear-gradient(135deg, #4f9bff, #0ed4c7);
      color: #070b17;
    }

    .modal-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(79, 155, 255, 0.3);
    }

    .modal-btn.secondary {
      background: rgba(255,255,255,0.08);
      color: #eef2ff;
    }

    .modal-btn.secondary:hover {
      background: rgba(255,255,255,0.12);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(79, 155, 255, 0.2);
      border: 1px solid rgba(79, 155, 255, 0.4);
      border-radius: 12px;
      padding: 16px 20px;
      color: #c5d0ff;
      z-index: 6000;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .nav-links {
      display: flex;
      gap: 18px;
    }

    .nav-links a {
      color: #8fb7ff;
      text-decoration: none;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: #4f9bff;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 300px;
      text-align: center;
      color: #a8b7ff;
    }

    @media (max-width: 900px) {
      .content {
        grid-template-columns: 1fr;
      }

      .sidebar {
        order: 2;
      }

      .main-area {
        order: 1;
      }
    }

    @media (max-width: 640px) {
      .container {
        padding: 16px;
      }

      .control-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>🎭 Character Chat</h1>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="chat.html">Ben GPT</a>
    </nav>
  </header>

  <main class="container">
    <div class="content">
      <aside class="sidebar">
        <h2>👥 Characters</h2>
        <button class="add-btn" id="addCharacterBtn">+ New</button>
        <div class="character-list" id="characterList"></div>
      </aside>

      <section class="main-area">
        <div class="controls">
          <div class="control-row">
            <div class="control-item">
              <label>Character 1</label>
              <select id="character1Select">
                <option value="">Select...</option>
              </select>
            </div>
            <div class="control-item">
              <label>Character 2</label>
              <select id="character2Select">
                <option value="">Select...</option>
              </select>
            </div>
          </div>
          <div class="control-row">
            <div class="control-item">
              <label>Character 3 (optional)</label>
              <select id="character3Select">
                <option value="">Select...</option>
              </select>
            </div>
          </div>
          <div class="control-row full">
            <div class="control-item">
              <label>Topic for them to discuss</label>
              <input type="text" id="topicInput" placeholder="e.g., Why do we need sleep?" />
            </div>
          </div>
          <button class="start-btn" id="startBtn" disabled>Start Conversation 🎬</button>
        </div>

        <div class="chat-display">
          <div class="message-list" id="messageList">
            <div class="empty-state">
              <p>Select 2-3 characters and give them a topic to discuss!</p>
            </div>
          </div>
        </div>

        <div class="controls-bottom">
          <div style="color: #a8b7ff; font-size: 0.9rem;" id="statusText"></div>
          <button class="stop-btn" id="stopBtn" style="display: none;">Stop</button>
        </div>
      </section>
    </div>
  </main>

  <!-- Create Character Modal -->
  <div class="modal" id="characterModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Create Character</h3>
      </div>
      <div class="form-group">
        <label for="charName">Character Name *</label>
        <input type="text" id="charName" placeholder="e.g., SpongeBob" />
      </div>
      <div class="form-group">
        <label for="charEmoji">Emoji</label>
        <input type="text" id="charEmoji" placeholder="🧽" maxlength="5" />
      </div>
      <div class="form-group">
        <label for="charDescription">Personality & How they talk *</label>
        <textarea id="charDescription" placeholder="SpongeBob is enthusiastic, innocent, and always optimistic..." rows="4"></textarea>
      </div>
      <div class="modal-buttons">
        <button class="modal-btn secondary" id="cancelBtn">Cancel</button>
        <button class="modal-btn primary" id="saveCharBtn">Create</button>
      </div>
    </div>
  </div>

  <script>
    // Direct Gemini API - Free Tier
    const GEMINI_API_URL = 'https://generativelanguage.googleapis.com/v1beta1/models/gemini-1.5-flash-latest:generateContent';
    // Get your free API key from: https://aistudio.google.com/app/apikey
    const GEMINI_API_KEY = 'AQ.Ab8RN6KO2Y5VpqvwxCS2ol3spgs-JKFqJGBK65MXjYpHuCz1BA'; // Replace this with your actual key

    let characters = [];
    let conversation = [];
    let isGenerating = false;
    let shouldStop = false;

    function loadCharacters() {
      const saved = localStorage.getItem('cc_characters');
      if (saved) {
        try {
          characters = JSON.parse(saved);
        } catch (e) {
          characters = [];
        }
      }
    }

    function saveCharacters() {
      localStorage.setItem('cc_characters', JSON.stringify(characters));
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function renderCharacterList() {
      const list = document.getElementById('characterList');
      list.innerHTML = '';

      characters.forEach((char, idx) => {
        const item = document.createElement('div');
        item.className = 'character-item';
        item.innerHTML = `
          <div class="character-emoji">${char.emoji || '👤'}</div>
          <p class="character-name">${char.name}</p>
          <button style="width: 100%; padding: 6px; margin-top: 8px; background: rgba(255,107,107,0.15); border: 1px solid rgba(255,107,107,0.3); color: #ff9b9b; border-radius: 6px; cursor: pointer; font-size: 0.75rem;" onclick="deleteChar('${char.id}')">Delete</button>
        `;
        list.appendChild(item);
      });
    }

    function deleteChar(id) {
      if (!confirm('Delete this character?')) return;
      characters = characters.filter(c => c.id !== id);
      saveCharacters();
      renderCharacterList();
      updateSelects();
      showToast('Character deleted');
    }

    function updateSelects() {
      const sel1 = document.getElementById('character1Select');
      const sel2 = document.getElementById('character2Select');
      const sel3 = document.getElementById('character3Select');

      [sel1, sel2, sel3].forEach(sel => {
        const current = sel.value;
        sel.innerHTML = '<option value="">Select...</option>';
        characters.forEach(char => {
          const opt = document.createElement('option');
          opt.value = char.id;
          opt.textContent = `${char.emoji || '👤'} ${char.name}`;
          sel.appendChild(opt);
        });
        sel.value = current;
      });

      checkReadyToStart();
    }

    function checkReadyToStart() {
      const c1 = document.getElementById('character1Select').value;
      const c2 = document.getElementById('character2Select').value;
      const btn = document.getElementById('startBtn');
      btn.disabled = !c1 || !c2;
    }

    function openAddModal() {
      document.getElementById('charName').value = '';
      document.getElementById('charEmoji').value = '';
      document.getElementById('charDescription').value = '';
      document.getElementById('characterModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('characterModal').classList.remove('open');
    }

    function saveCharacter() {
      const name = document.getElementById('charName').value.trim();
      const emoji = document.getElementById('charEmoji').value.trim() || '👤';
      const desc = document.getElementById('charDescription').value.trim();

      if (!name || !desc) {
        showToast('Name and description required');
        return;
      }

      const newChar = {
        id: Date.now().toString(),
        name,
        emoji,
        description: desc
      };

      characters.push(newChar);
      saveCharacters();
      updateSelects();
      renderCharacterList();
      closeModal();
      showToast(`${name} created!`);
    }

    async function getCharacterResponse(char, otherChars, topic, previousMessages) {
      const otherNames = otherChars.map(c => c.name).join(' and ');

      const systemPrompt = `You are ${char.name}. ${char.description}

You are having a conversation with ${otherNames} about: "${topic}"

IMPORTANT:
- Keep your response to 1-3 sentences max (per character)
- Stay in character and respond naturally
- Don't repeat what was just said
- React to what others say, don't just add random thoughts`;

      const promptText = [
        systemPrompt,
        ...previousMessages.map(msg => `${msg.speaker}: ${msg.text}`),
        `As ${char.name}, reply with the next line in the conversation.`
      ].join('\n\n');

      try {
        const response = await fetch(GEMINI_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-goog-api-key': GEMINI_API_KEY,
          },
          body: JSON.stringify({
            contents: [
              {
                parts: [
                  { text: promptText }
                ]
              }
            ],
            generationConfig: {
              temperature: 0.9,
              topP: 0.95,
              maxOutputTokens: 150
            }
          })
        });

        if (!response.ok) {
          const errorText = await response.text();
          console.error('Response:', errorText);
          throw new Error(`API error: ${response.status}`);
        }

        const data = await response.json();
        console.log('API Response:', data);
        
        // Get text from response
        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;

        if (text) {
          return text.trim();
        }

        throw new Error(`No text in response`);
      } catch (error) {
        console.error('API error:', error);
        showToast(`Error: ${error.message}`);
        return null;
      }
    }

    function renderMessages() {
      const list = document.getElementById('messageList');
      list.innerHTML = '';

      if (conversation.length === 0) {
        list.innerHTML = '<div class="empty-state"><p>Select 2-3 characters and give them a topic to discuss!</p></div>';
        return;
      }

      conversation.forEach((msg, idx) => {
        const div = document.createElement('div');
        const charIdx = [characters.find(c => c.name === msg.speaker)?.id].findIndex(x => x);
        let className = 'message';
        
        if (msg.speaker === conversation[0]?.speaker) className += ' char1';
        else if (msg.speaker === conversation.find(m => m.speaker !== conversation[0]?.speaker)?.speaker) className += ' char2';
        else className += ' char3';

        if (msg.loading) className += ' loading';

        div.innerHTML = `
          <div class="message-speaker">${msg.speaker}</div>
          <div>${msg.text}</div>
        `;
        div.className = className;
        list.appendChild(div);
      });

      list.scrollTop = list.scrollHeight;
    }

    async function startConversation() {
      const c1id = document.getElementById('character1Select').value;
      const c2id = document.getElementById('character2Select').value;
      const c3id = document.getElementById('character3Select').value;
      const topic = document.getElementById('topicInput').value.trim();

      if (!c1id || !c2id || !topic) {
        showToast('Select 2 characters and enter a topic');
        return;
      }

      const selectedIds = [c1id, c2id];
      if (c3id) selectedIds.push(c3id);

      const selectedChars = characters.filter(c => selectedIds.includes(c.id));
      if (selectedChars.length < 2) {
        showToast('Need at least 2 different characters');
        return;
      }

      conversation = [];
      isGenerating = true;
      shouldStop = false;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').style.display = 'inline-block';
      document.getElementById('statusText').textContent = 'Generating conversation...';

      // Initial prompt
      const initialPrompt = `The topic is: "${topic}". Start the conversation naturally!`;
      conversation.push({ speaker: selectedChars[0].name, text: initialPrompt });

      renderMessages();

      let turnCount = 0;
      const maxTurns = 8;

      while (turnCount < maxTurns && !shouldStop) {
        // Get next speaker (rotate through characters)
        const currentSpeakerIdx = turnCount % selectedChars.length;
        const speaker = selectedChars[currentSpeakerIdx];
        const otherChars = selectedChars.filter(c => c.id !== speaker.id);

        // Get last few messages for context
        const context = conversation.slice(-4);

        // Show loading
        conversation.push({ speaker: speaker.name, text: 'thinking...', loading: true });
        renderMessages();

        // Get response
        const response = await getCharacterResponse(speaker, otherChars, topic, context);

        // Remove loading, add response
        conversation.pop();

        if (response) {
          conversation.push({ speaker: speaker.name, text: response });
          renderMessages();
          // Small delay between responses for readability
          await new Promise(r => setTimeout(r, 600));
        } else {
          showToast('API error - stopping conversation');
          break;
        }

        turnCount++;
      }

      isGenerating = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('statusText').textContent = shouldStop ? 'Stopped' : 'Conversation complete!';
    }

    function stopConversation() {
      shouldStop = true;
      document.getElementById('statusText').textContent = 'Stopping...';
    }

    // EVENT LISTENERS
    document.getElementById('addCharacterBtn').addEventListener('click', openAddModal);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('saveCharBtn').addEventListener('click', saveCharacter);
    document.getElementById('startBtn').addEventListener('click', startConversation);
    document.getElementById('stopBtn').addEventListener('click', stopConversation);

    document.getElementById('character1Select').addEventListener('change', checkReadyToStart);
    document.getElementById('character2Select').addEventListener('change', checkReadyToStart);
    document.getElementById('character3Select').addEventListener('change', checkReadyToStart);

    document.getElementById('characterModal').addEventListener('click', (e) => {
      if (e.target.id === 'characterModal') closeModal();
    });

    // INIT
    loadCharacters();
    renderCharacterList();
    updateSelects();
    renderMessages();
  </script>
</body>
</html>
