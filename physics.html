<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physics Slam • Damage = Profit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f0f0; overflow: hidden; }
    header { padding: 15px 20px; background: linear-gradient(135deg, #ff6b6b 0%, #4ecdc4 50%, #ffe66d 100%); position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
    h1 { color: white; font-size: 1.8rem; margin: 0; }
    .controls { display: flex; gap: 15px; align-items: center; }
    .money-display { background: rgba(255,255,255,0.3); padding: 10px 16px; border-radius: 25px; color: white; font-weight: bold; }
    .back-btn { background: rgba(255,255,255,0.3); border: none; padding: 8px 14px; border-radius: 25px; color: white; cursor: pointer; font-weight: bold; text-decoration: none; }
    canvas { display: block; margin-top: 60px; background: linear-gradient(135deg, #e0f7ff 0%, #f5f5f5 100%); position: relative; z-index: 50; }
    .sidebar { position: fixed; right: 20px; top: 80px; background: rgba(255,255,255,0.95); border-radius: 12px; padding: 20px; z-index: 10; max-width: 250px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
    .sidebar h3 { color: #ff6b6b; margin-bottom: 15px; }
    .shop-item { background: #f0f0f0; padding: 10px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .shop-item:hover { border-color: #4ecdc4; transform: translateY(-2px); }
    .item-name { font-weight: bold; font-size: 0.9rem; margin-bottom: 4px; }
    .item-price { color: #ff6b6b; font-weight: bold; font-size: 0.85rem; }
    .stats { position: fixed; left: 20px; top: 80px; background: rgba(255,255,255,0.95); padding: 15px; border-radius: 8px; z-index: 10; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .stat-row { margin-bottom: 8px; font-weight: bold; color: #333; }
  </style>
</head>
<body>
  <header>
    <h1>💥 Physics Slam</h1>
    <div class="controls">
      <div class="money-display" id="moneyDisplay">💰 $0</div>
      <a href="index.html" class="back-btn">← Back</a>
    </div>
  </header>

  <canvas id="gameCanvas"></canvas>

  <div class="stats">
    <div class="stat-row">💰 Money: <span id="statMoney">$0</span></div>
    <div class="stat-row">❤️ Health: <span id="statHealth">100</span></div>
    <div class="stat-row">🎯 Items: <span id="statItems">0</span></div>
  </div>

  <div class="sidebar">
    <h3>🛒 Shop</h3>
    <div class="shop-item" onclick="buyItem('ball')">
      <div class="item-name">⚫ Ball</div>
      <div class="item-price">$5</div>
    </div>
    <div class="shop-item" onclick="buyItem('box')">
      <div class="item-name">📦 Box</div>
      <div class="item-price">$10</div>
    </div>
    <div class="shop-item" onclick="buyItem('spike')">
      <div class="item-name">🌹 Spike</div>
      <div class="item-price">$15</div>
    </div>
    <div class="shop-item" onclick="buyItem('explosive')">
      <div class="item-name">💣 Boom!</div>
      <div class="item-price">$25</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - 60;

    const startingMoney = 50;
    let money = Number(localStorage.getItem('physicsGameMoney'));
    if (Number.isNaN(money)) money = startingMoney;
    let health = 100;
    let itemsSpawned = 0;

    // Ragdoll body parts
    class RagdollPart {
      constructor(x, y, radius, options = {}) {
        this.x = x;
        this.y = y;
        this.prevX = x;
        this.prevY = y;
        this.vx = 0;
        this.vy = 0;
        this.radius = radius;
        this.mass = options.mass || 1;
        this.color = options.color || '#ff6b6b';
        this.pinned = options.pinned || false;
      }

      update(gravity, friction) {
        if (this.pinned) return;

        this.vx = (this.x - this.prevX) * friction;
        this.vy = (this.y - this.prevY) * friction;
        
        this.prevX = this.x;
        this.prevY = this.y;

        this.vy += gravity;
        this.x += this.vx;
        this.y += this.vy;

        // Boundary collisions
        if (this.x - this.radius < 20) {
          this.x = 20 + this.radius;
          this.vx *= -0.6;
        }
        if (this.x + this.radius > canvas.width - 20) {
          this.x = canvas.width - 20 - this.radius;
          this.vx *= -0.6;
        }
        if (this.y + this.radius > canvas.height - 20) {
          this.y = canvas.height - 20 - this.radius;
          this.vy *= -0.5;
        }
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    class Joint {
      constructor(partA, partB, length, stiffness = 0.95) {
        this.partA = partA;
        this.partB = partB;
        this.length = length;
        this.stiffness = stiffness;
      }

      constrain() {
        const dx = this.partB.x - this.partA.x;
        const dy = this.partB.y - this.partA.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const diff = (this.length - dist) / dist;
        const offsetX = dx * diff * 0.5 * this.stiffness;
        const offsetY = dy * diff * 0.5 * this.stiffness;

        this.partA.x -= offsetX;
        this.partA.y -= offsetY;
        this.partB.x += offsetX;
        this.partB.y += offsetY;
      }

      draw() {
        ctx.strokeStyle = 'rgba(100, 100, 100, 0.5)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(this.partA.x, this.partA.y);
        ctx.lineTo(this.partB.x, this.partB.y);
        ctx.stroke();
      }
    }

    // Create ragdoll
    const ragdoll = {
      parts: [],
      joints: [],
      isDragged: false,
      draggedPart: null,

      create(x, y) {
        // Head
        const head = new RagdollPart(x, y - 120, 20, { color: '#ffdbac', mass: 1 });
        
        // Torso
        const upperTorso = new RagdollPart(x, y - 50, 18, { color: '#ff6b6b', mass: 2 });
        const lowerTorso = new RagdollPart(x, y + 20, 16, { color: '#ff5252', mass: 1.5 });

        // Left arm
        const leftShoulder = new RagdollPart(x - 35, y - 60, 12, { color: '#ffdbac' });
        const leftForearm = new RagdollPart(x - 70, y - 50, 10, { color: '#ffdbac' });
        const leftHand = new RagdollPart(x - 95, y - 45, 8, { color: '#ffdbac' });

        // Right arm
        const rightShoulder = new RagdollPart(x + 35, y - 60, 12, { color: '#ffdbac' });
        const rightForearm = new RagdollPart(x + 70, y - 50, 10, { color: '#ffdbac' });
        const rightHand = new RagdollPart(x + 95, y - 45, 8, { color: '#ffdbac' });

        // Left leg
        const leftHip = new RagdollPart(x - 12, y + 50, 14, { color: '#4a4a4a' });
        const leftCalf = new RagdollPart(x - 12, y + 95, 12, { color: '#3a3a3a' });
        const leftFoot = new RagdollPart(x - 12, y + 135, 10, { color: '#2a2a2a' });

        // Right leg
        const rightHip = new RagdollPart(x + 12, y + 50, 14, { color: '#4a4a4a' });
        const rightCalf = new RagdollPart(x + 12, y + 95, 12, { color: '#3a3a3a' });
        const rightFoot = new RagdollPart(x + 12, y + 135, 10, { color: '#2a2a2a' });

        this.parts = [head, upperTorso, lowerTorso, leftShoulder, leftForearm, leftHand, 
                      rightShoulder, rightForearm, rightHand, leftHip, leftCalf, leftFoot, 
                      rightHip, rightCalf, rightFoot];

        // Joints
        this.joints = [
          new Joint(head, upperTorso, 25, 0.95),
          new Joint(upperTorso, lowerTorso, 40, 0.9),

          new Joint(upperTorso, leftShoulder, 28, 0.85),
          new Joint(leftShoulder, leftForearm, 35, 0.85),
          new Joint(leftForearm, leftHand, 28, 0.8),

          new Joint(upperTorso, rightShoulder, 28, 0.85),
          new Joint(rightShoulder, rightForearm, 35, 0.85),
          new Joint(rightForearm, rightHand, 28, 0.8),

          new Joint(lowerTorso, leftHip, 22, 0.9),
          new Joint(leftHip, leftCalf, 45, 0.9),
          new Joint(leftCalf, leftFoot, 40, 0.85),

          new Joint(lowerTorso, rightHip, 22, 0.9),
          new Joint(rightHip, rightCalf, 45, 0.9),
          new Joint(rightCalf, rightFoot, 40, 0.85)
        ];
      },

      update(gravity, friction) {
        // Update all parts
        this.parts.forEach(part => part.update(gravity, friction));

        // Constrain joints multiple times for stability
        for (let i = 0; i < 3; i++) {
          this.joints.forEach(joint => joint.constrain());
        }
      },

      draw() {
        this.joints.forEach(joint => joint.draw());
        this.parts.forEach(part => part.draw());
      },

      getPart(x, y) {
        for (let part of this.parts) {
          const dx = x - part.x;
          const dy = y - part.y;
          if (Math.sqrt(dx * dx + dy * dy) < part.radius + 10) {
            return part;
          }
        }
        return null;
      }
    };

    ragdoll.create(canvas.width / 2, 250);

    let objects = [];
    const gravity = 0.4;
    const friction = 0.99;

    function update() {
      ragdoll.update(gravity, friction);

      objects.forEach((obj, idx) => {
        obj.vy += gravity * 0.5;
        obj.vx *= friction;
        obj.vy *= friction;

        obj.x += obj.vx;
        obj.y += obj.vy;

        if (obj.x - obj.size < 20) { obj.x = 20 + obj.size; obj.vx *= -0.6; }
        if (obj.x + obj.size > canvas.width - 20) { obj.x = canvas.width - 20 - obj.size; obj.vx *= -0.6; }
        if (obj.y + obj.size > canvas.height - 20) { obj.y = canvas.height - 20 - obj.size; obj.vy *= -0.5; }

        // Check collisions with all ragdoll parts
        ragdoll.parts.forEach(part => {
          const dx = obj.x - part.x;
          const dy = obj.y - part.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const minDist = obj.size + part.radius;

          if (dist < minDist && dist > 0) {
            const damage = Math.floor(Math.sqrt(obj.vx * obj.vx + obj.vy * obj.vy) / 2.5);
            if (damage > 0) {
              health -= damage;
              money += damage * 2;
              updateUI();

              // Push part
              const angle = Math.atan2(dy, dx);
              part.vx += Math.cos(angle) * 8;
              part.vy += Math.sin(angle) * 8;

              // Push object back
              obj.vx -= Math.cos(angle) * 4;
              obj.vy -= Math.sin(angle) * 4;
            }

            if (health <= 0) health = 0;
          }
        });

      });

      objects = objects.filter(obj => obj.y <= canvas.height + 100);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Ground
      ctx.fillStyle = '#00ff00';
      ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.strokeRect(0, canvas.height - 20, canvas.width, 20);

      // Walls
      ctx.fillStyle = '#ff00ff';
      ctx.fillRect(0, 0, 20, canvas.height);
      ctx.fillRect(canvas.width - 20, 0, 20, canvas.height);

      // Draw ragdoll
      ragdoll.draw();

      // Draw objects
      objects.forEach(obj => {
        if (obj.type === 'ball') {
          ctx.fillStyle = '#ffe66d';
          ctx.strokeStyle = '#ff9800';
        } else if (obj.type === 'box') {
          ctx.fillStyle = '#a78bfa';
          ctx.strokeStyle = '#7c3aed';
        } else if (obj.type === 'spike') {
          ctx.fillStyle = '#ff6b6b';
          ctx.strokeStyle = '#ff0000';
        } else if (obj.type === 'explosive') {
          ctx.fillStyle = '#ff00ff';
          ctx.strokeStyle = '#ff0088';
        }

        ctx.lineWidth = 2;

        if (obj.type === 'ball' || obj.type === 'spike' || obj.type === 'explosive') {
          ctx.beginPath();
          ctx.arc(obj.x, obj.y, obj.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.fillRect(obj.x - obj.size, obj.y - obj.size, obj.size * 2, obj.size * 2);
          ctx.strokeRect(obj.x - obj.size, obj.y - obj.size, obj.size * 2, obj.size * 2);
        }
      });

      // Health bar
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(20, 20, 200, 20);
      ctx.fillStyle = health > 30 ? '#4ecdc4' : '#ff6b6b';
      ctx.fillRect(22, 22, (health / 100) * 196, 16);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(20, 20, 200, 20);

      ctx.fillStyle = '#000';
      ctx.font = 'bold 14px Arial';
      ctx.fillText(`Health: ${health}`, 25, 38);
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    function updateUI() {
      document.getElementById('moneyDisplay').textContent = `💰 $${money}`;
      document.getElementById('statMoney').textContent = `$${money}`;
      document.getElementById('statHealth').textContent = health;
      document.getElementById('statItems').textContent = itemsSpawned;
      localStorage.setItem('physicsGameMoney', money);
    }

    window.buyItem = function(type) {
      const prices = { ball: 5, box: 10, spike: 15, explosive: 25 };

      if (money < prices[type]) {
        alert('Not enough money!');
        return;
      }

      money -= prices[type];
      itemsSpawned++;

      const obj = {
        x: Math.random() * (canvas.width - 100) + 50,
        y: 50,
        vx: (Math.random() - 0.5) * 6,
        vy: 0,
        type: type,
        size: type === 'explosive' ? 18 : (type === 'spike' ? 12 : (type === 'box' ? 14 : 11))
      };

      objects.push(obj);
      updateUI();
    };

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const part = ragdoll.getPart(mouseX, mouseY);
      if (part) {
        ragdoll.isDragged = true;
        ragdoll.draggedPart = part;
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (ragdoll.isDragged && ragdoll.draggedPart) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        ragdoll.draggedPart.vx = (mouseX - ragdoll.draggedPart.x) * 0.5;
        ragdoll.draggedPart.vy = (mouseY - ragdoll.draggedPart.y) * 0.5;
        ragdoll.draggedPart.x = mouseX;
        ragdoll.draggedPart.y = mouseY;
      }
    });

    canvas.addEventListener('mouseup', () => {
      ragdoll.isDragged = false;
      ragdoll.draggedPart = null;
    });

    canvas.addEventListener('mouseleave', () => {
      ragdoll.isDragged = false;
      ragdoll.draggedPart = null;
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - 60;
    });

    updateUI();
    gameLoop();
  </script>
</body>
</html>
