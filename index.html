<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jai's Fun Stuff • Unblocked Games</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-light: #fafafa;
      --bg-light-secondary: #f0f0f0;
      --text-light: #1a1a1a;
      --text-light-secondary: #666;
      
      --bg-dark: #0a0a0a;
      --bg-dark-secondary: #1a1a1a;
      --text-dark: #f5f5f5;
      --text-dark-secondary: #aaa;

      --accent-1: #ff6b6b;
      --accent-2: #4ecdc4;
      --accent-3: #ffe66d;
      --accent-4: #a78bfa;
      --accent-5: #f87171;
      --glow-red: 255, 107, 107;
      --glow-teal: 78, 205, 196;
      --glow-yellow: 255, 230, 109;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #fafafa 0%, #f0f0f0 50%, #e8f4f8 100%);
      background-attachment: fixed;
      color: var(--text-light);
      transition: background-color 0.3s, color 0.3s;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 80%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(78, 205, 196, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(255, 230, 109, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
      animation: gradient-shift 8s ease-in-out infinite;
    }

    @keyframes gradient-shift {
      0%, 100% {
        background: 
          radial-gradient(circle at 20% 80%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(78, 205, 196, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 40% 40%, rgba(255, 230, 109, 0.1) 0%, transparent 50%);
      }
      50% {
        background: 
          radial-gradient(circle at 30% 70%, rgba(255, 107, 107, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 70% 30%, rgba(78, 205, 196, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 50% 50%, rgba(255, 230, 109, 0.15) 0%, transparent 50%);
      }
    }

    body.dark-mode {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0d1b1f 100%);
      background-attachment: fixed;
      color: var(--text-dark);
    }

    body.dark-mode::before {
      background: 
        radial-gradient(circle at 20% 80%, rgba(255, 107, 107, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(78, 205, 196, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(255, 230, 109, 0.2) 0%, transparent 50%);
    }

    header {
      padding: 30px 20px;
      text-align: center;
      background: linear-gradient(135deg, #ff6b6b 0%, #4ecdc4 50%, #ffe66d 100%);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1), 0 0 40px rgba(255, 107, 107, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: header-glow 3s ease-in-out infinite;
    }

    @keyframes header-glow {
      0%, 100% { box-shadow: 0 4px 20px rgba(0,0,0,0.1), 0 0 40px rgba(255, 107, 107, 0.3); }
      50% { box-shadow: 0 4px 20px rgba(0,0,0,0.1), 0 0 60px rgba(78, 205, 196, 0.4); }
    }

    .dark-mode header {
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .header-content {
      flex: 1;
      text-align: center;
    }

    .header-content h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
      font-weight: 800;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2), 0 0 20px rgba(255,255,255,0.3);
      letter-spacing: -1px;
      animation: title-pulse 2s ease-in-out infinite;
    }

    @keyframes title-pulse {
      0%, 100% { text-shadow: 2px 2px 4px rgba(0,0,0,0.2), 0 0 20px rgba(255,255,255,0.3); }
      50% { text-shadow: 2px 2px 4px rgba(0,0,0,0.2), 0 0 30px rgba(255,255,255,0.6); }
    }

    .header-content p {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.95);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .theme-toggle {
      background: rgba(255,255,255,0.3);
      border: 2px solid rgba(255,255,255,0.6);
      padding: 10px 16px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.3s;
      color: white;
      font-weight: bold;
    }

    .theme-toggle:hover {
      background: rgba(255,255,255,0.5);
      transform: scale(1.05);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
      margin-bottom: 60px;
    }

    .game-card {
      background: var(--bg-light-secondary);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
      cursor: pointer;
      border: 3px solid transparent;
      position: relative;
      animation: card-entrance 0.6s ease-out both;
    }

    @keyframes card-entrance {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .game-card:nth-child(1) { animation-delay: 0.2s; }

    .dark-mode .game-card {
      background: var(--bg-dark-secondary);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .game-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.15);
    }

    .dark-mode .game-card:hover {
      box-shadow: 0 16px 40px rgba(0,0,0,0.7);
    }

    .game-card.bengpt {
      border-color: var(--accent-1);
    }

    .game-card.bengpt:hover {
      box-shadow: 0 16px 40px var(--accent-1), 0 0 30px rgba(255, 107, 107, 0.5);
      opacity: 0.95;
    }

    .dark-mode .game-card.bengpt:hover {
      box-shadow: 0 0 30px var(--accent-1);
    }

    .game-header {
      height: 140px;
      background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-5) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 3rem;
      font-weight: bold;
      position: relative;
      overflow: hidden;
    }

    .game-card.bengpt .game-header {
      background: linear-gradient(135deg, #ff6b6b 0%, #ff8787 100%);
    }

    .game-header::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .game-header::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .game-body {
      padding: 24px;
    }

    .game-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-light);
    }

    .dark-mode .game-title {
      color: var(--text-dark);
    }

    .game-description {
      font-size: 0.95rem;
      color: var(--text-light-secondary);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .dark-mode .game-description {
      color: var(--text-dark-secondary);
    }

    .game-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(0,0,0,0.05);
    }

    .dark-mode .game-stats {
      border-bottom-color: rgba(255,255,255,0.1);
    }

    .visit-counter {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-light-secondary);
    }

    .dark-mode .visit-counter {
      color: var(--text-dark-secondary);
    }

    .visit-count {
      background: rgba(255, 107, 107, 0.2);
      color: var(--accent-1);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
    }

    .play-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-5) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.5), 0 0 25px rgba(255, 107, 107, 0.4);
    }

    .play-btn:active {
      transform: scale(0.98);
    }

    .play-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
      border-radius: 10px;
      animation: btn-shine 2s infinite;
    }

    @keyframes btn-shine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light-secondary);
      border-top: 2px solid var(--bg-light-secondary);
      font-size: 0.9rem;
    }

    .dark-mode footer {
      color: var(--text-dark-secondary);
      border-top-color: var(--bg-dark-secondary);
    }

    .coming-soon {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--accent-3);
      color: #333;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .easter-egg-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
      cursor: pointer;
      user-select: none;
    }

    .sleeping-guy {
      font-size: 4rem;
      animation: sleep-breathe 2s ease-in-out infinite;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
      transition: transform 0.1s;
    }

    .easter-egg-container:hover .sleeping-guy {
      transform: scale(1.1);
    }

    @keyframes sleep-breathe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    @keyframes page-shake {
      0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
      10% { transform: translateX(-5px) translateY(-5px) rotate(-0.5deg); }
      20% { transform: translateX(5px) translateY(5px) rotate(0.5deg); }
      30% { transform: translateX(-5px) translateY(5px) rotate(-0.5deg); }
      40% { transform: translateX(5px) translateY(-5px) rotate(0.5deg); }
      50% { transform: translateX(-5px) translateY(-5px) rotate(-0.5deg); }
      60% { transform: translateX(5px) translateY(5px) rotate(0.5deg); }
      70% { transform: translateX(-5px) translateY(5px) rotate(-0.5deg); }
      80% { transform: translateX(5px) translateY(-5px) rotate(0.5deg); }
      90% { transform: translateX(-3px) translateY(-3px) rotate(-0.3deg); }
    }

    body.shake-page {
      animation: page-shake 0.6s ease-in-out;
    }

    .scream-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 8rem;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      animation: scream-pop 0.6s ease-out;
      text-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
    }

    @keyframes scream-pop {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.5);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2);
      }
    }

    .floating-particle {
      position: fixed;
      pointer-events: none;
      z-index: 1;
    }

    #particle-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes float-up {
      to {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 768px) {
      .header-content h1 {
        font-size: 1.8rem;
      }

      .header-content p {
        font-size: 0.85rem;
      }

      .games-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .container {
        padding: 40px 16px;
      }

      header {
        flex-direction: column;
        gap: 15px;
        padding: 20px;
      }

      .theme-toggle {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .header-content h1 {
        font-size: 1.4rem;
      }

      .game-header {
        height: 100px;
        font-size: 2rem;
      }

      .game-title {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>🎮 Jai's Fun Stuff</h1>
      <p>the BETTER unblocked games</p>
    </div>
    <button class="theme-toggle" id="themeToggle">🌙</button>
  </header>

  <main class="container">
    <div class="games-grid">
      <!-- Ben GPT Card -->
      <div class="game-card bengpt">
        <div class="game-header">💬</div>
        <div class="game-body">
          <h2 class="game-title">Ben GPT</h2>
          <p class="game-description">Chat with an intelligent AI assistant. Ask questions, have conversations, and explore the power of natural language processing.</p>
          <div class="game-stats">
            <div class="visit-counter">
              👀 <span class="visit-count" id="bengptVisits">0</span>
            </div>
          </div>
          <a href="chat.html" class="play-btn" onclick="incrementBengptVisits()">Play Now 🚀</a>
        </div>
      </div>
    </div>
  </main>

  <div id="particle-container"></div>

  <div class="easter-egg-container" id="easterEgg">
    <div class="sleeping-guy">😴</div>
  </div>

  <footer>
    <p>Made with ❤️ by Jai | More fun games coming soon!</p>
  </footer>

  <script>
    // Theme Toggle
    const themeToggle = document.getElementById('themeToggle');
    const htmlElement = document.documentElement;

    function loadTheme() {
      const savedTheme = localStorage.getItem('jaisFunTheme') || 'light';
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        themeToggle.textContent = '☀️';
      } else {
        document.body.classList.remove('dark-mode');
        themeToggle.textContent = '🌙';
      }
    }

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('jaisFunTheme', isDark ? 'dark' : 'light');
      themeToggle.textContent = isDark ? '☀️' : '🌙';
    });

    // Visit Counter
    function loadBengptVisits() {
      const visits = parseInt(localStorage.getItem('bengptGlobalVisits') || '0');
      document.getElementById('bengptVisits').textContent = visits.toLocaleString();
    }

    function incrementBengptVisits() {
      let visits = parseInt(localStorage.getItem('bengptGlobalVisits') || '0');
      visits++;
      localStorage.setItem('bengptGlobalVisits', visits.toString());
      document.getElementById('bengptVisits').textContent = visits.toLocaleString();
    }

    // Initialize
    loadTheme();
    loadBengptVisits();

    // Create floating particles
    function createParticles() {
      const container = document.getElementById('particle-container');
      const particles = ['✨', '🎮', '🎨', '🚀', '⭐', '💫', '🎯', '🎪'];
      
      function spawnParticle() {
        const particle = document.createElement('div');
        particle.className = 'floating-particle';
        particle.textContent = particles[Math.floor(Math.random() * particles.length)];
        
        const x = Math.random() * window.innerWidth;
        const y = window.innerHeight + 50;
        const duration = Math.random() * 5 + 5;
        const size = Math.random() * 20 + 15;
        
        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        particle.style.fontSize = size + 'px';
        particle.style.opacity = Math.random() * 0.5 + 0.3;
        particle.style.animation = `float-up ${duration}s linear forwards`;
        
        container.appendChild(particle);
        
        setTimeout(() => particle.remove(), duration * 1000);
      }
      
      // Spawn particles periodically
      setInterval(spawnParticle, 1500);
    }

    // Start particle creation
    createParticles();

    // Add scroll animation trigger
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.style.opacity = '1';
          entry.target.style.transform = 'translateY(0)';
        }
      });
    }, observerOptions);

    document.querySelectorAll('.game-card').forEach(card => {
      card.style.opacity = '0';
      card.style.transform = 'translateY(20px)';
      card.style.transition = 'all 0.6s ease-out';
      observer.observe(card);
    });

    // Listen for storage changes from other tabs
    window.addEventListener('storage', (e) => {
      if (e.key === 'bengptGlobalVisits') {
        loadBengptVisits();
      } else if (e.key === 'jaisFunTheme') {
        loadTheme();
      }
    });

    // Easter Egg - Sleeping Guy
    const easterEgg = document.getElementById('easterEgg');
    const sleepingGuy = easterEgg.querySelector('.sleeping-guy');

    easterEgg.addEventListener('click', () => {
      // Create scream text
      const scream = document.createElement('div');
      scream.className = 'scream-text';
      scream.textContent = '😱';
      document.body.appendChild(scream);

      // Trigger page shake
      document.body.classList.add('shake-page');

      // Update sleeping guy to awake
      sleepingGuy.textContent = '😱';

      // Reset after animation
      setTimeout(() => {
        document.body.classList.remove('shake-page');
        sleepingGuy.textContent = '😴';
        scream.remove();
      }, 600);
    });
  </script>
</body>
</html>
