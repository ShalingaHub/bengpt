<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jai's Fun Stuff • Unblocked Games</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-light: #fafafa;
      --bg-light-secondary: #f0f0f0;
      --text-light: #1a1a1a;
      --text-light-secondary: #666;
      
      --bg-dark: #0a0a0a;
      --bg-dark-secondary: #1a1a1a;
      --text-dark: #f5f5f5;
      --text-dark-secondary: #aaa;

      --accent-1: #ff6b6b;
      --accent-2: #4ecdc4;
      --accent-3: #ffe66d;
      --accent-4: #a78bfa;
      --accent-5: #f87171;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-light);
      transition: background-color 0.3s, color 0.3s;
    }

    body.dark-mode {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    header {
      padding: 30px 20px;
      text-align: center;
      background: linear-gradient(135deg, #ff6b6b 0%, #4ecdc4 50%, #ffe66d 100%);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dark-mode header {
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .header-content {
      flex: 1;
      text-align: center;
    }

    .header-content h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
      font-weight: 800;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
      letter-spacing: -1px;
    }

    .header-content p {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.95);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .theme-toggle {
      background: rgba(255,255,255,0.3);
      border: 2px solid rgba(255,255,255,0.6);
      padding: 10px 16px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.3s;
      color: white;
      font-weight: bold;
    }

    .theme-toggle:hover {
      background: rgba(255,255,255,0.5);
      transform: scale(1.05);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 30px;
      margin-bottom: 60px;
    }

    .game-card {
      background: var(--bg-light-secondary);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
      cursor: pointer;
      border: 3px solid transparent;
      position: relative;
    }

    .dark-mode .game-card {
      background: var(--bg-dark-secondary);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .game-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.15);
    }

    .dark-mode .game-card:hover {
      box-shadow: 0 16px 40px rgba(0,0,0,0.7);
    }

    .game-card.bengpt {
      border-color: var(--accent-1);
    }

    .game-card.bengpt:hover {
      box-shadow: 0 16px 40px var(--accent-1);
      opacity: 0.95;
    }

    .dark-mode .game-card.bengpt:hover {
      box-shadow: 0 0 30px var(--accent-1);
    }

    .game-header {
      height: 140px;
      background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-5) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 3rem;
      font-weight: bold;
      position: relative;
      overflow: hidden;
    }

    .game-card.bengpt .game-header {
      background: linear-gradient(135deg, #ff6b6b 0%, #ff8787 100%);
    }

    .game-header::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .game-body {
      padding: 24px;
    }

    .game-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-light);
    }

    .dark-mode .game-title {
      color: var(--text-dark);
    }

    .game-description {
      font-size: 0.95rem;
      color: var(--text-light-secondary);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .dark-mode .game-description {
      color: var(--text-dark-secondary);
    }

    .game-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(0,0,0,0.05);
    }

    .dark-mode .game-stats {
      border-bottom-color: rgba(255,255,255,0.1);
    }

    .visit-counter {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-light-secondary);
    }

    .dark-mode .visit-counter {
      color: var(--text-dark-secondary);
    }

    .visit-count {
      background: rgba(255, 107, 107, 0.2);
      color: var(--accent-1);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
    }

    .play-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-5) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .play-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
    }

    .play-btn:active {
      transform: scale(0.98);
    }

    footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light-secondary);
      border-top: 2px solid var(--bg-light-secondary);
      font-size: 0.9rem;
    }

    .dark-mode footer {
      color: var(--text-dark-secondary);
      border-top-color: var(--bg-dark-secondary);
    }

    .coming-soon {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--accent-3);
      color: #333;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    @media (max-width: 768px) {
      .header-content h1 {
        font-size: 1.8rem;
      }

      .header-content p {
        font-size: 0.85rem;
      }

      .games-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .container {
        padding: 40px 16px;
      }

      header {
        flex-direction: column;
        gap: 15px;
        padding: 20px;
      }

      .theme-toggle {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .header-content h1 {
        font-size: 1.4rem;
      }

      .game-header {
        height: 100px;
        font-size: 2rem;
      }

      .game-title {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <h1>🎮 Jai's Fun Stuff</h1>
      <p>the BETTER unblocked games</p>
    </div>
    <button class="theme-toggle" id="themeToggle">🌙</button>
  </header>

  <main class="container">
    <div class="games-grid">
      <!-- Ben GPT Card -->
      <div class="game-card bengpt">
        <div class="game-header">💬</div>
        <div class="game-body">
          <h2 class="game-title">Ben GPT</h2>
          <p class="game-description">Chat with an intelligent AI assistant. Ask questions, have conversations, and explore the power of natural language processing.</p>
          <div class="game-stats">
            <div class="visit-counter">
              👀 <span class="visit-count" id="bengptVisits">0</span>
            </div>
          </div>
          <a href="chat.html" class="play-btn" onclick="incrementBengptVisits()">Play Now 🚀</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>Made with ❤️ by Jai | More fun games coming soon!</p>
  </footer>

  <script>
    // Theme Toggle
    const themeToggle = document.getElementById('themeToggle');
    const htmlElement = document.documentElement;

    function loadTheme() {
      const savedTheme = localStorage.getItem('jaisFunTheme') || 'light';
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        themeToggle.textContent = '☀️';
      } else {
        document.body.classList.remove('dark-mode');
        themeToggle.textContent = '🌙';
      }
    }

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('jaisFunTheme', isDark ? 'dark' : 'light');
      themeToggle.textContent = isDark ? '☀️' : '🌙';
    });

    // Visit Counter
    function loadBengptVisits() {
      const visits = parseInt(localStorage.getItem('bengptGlobalVisits') || '0');
      document.getElementById('bengptVisits').textContent = visits.toLocaleString();
    }

    function incrementBengptVisits() {
      let visits = parseInt(localStorage.getItem('bengptGlobalVisits') || '0');
      visits++;
      localStorage.setItem('bengptGlobalVisits', visits.toString());
      document.getElementById('bengptVisits').textContent = visits.toLocaleString();
    }

    // Initialize
    loadTheme();
    loadBengptVisits();

    // Listen for storage changes from other tabs
    window.addEventListener('storage', (e) => {
      if (e.key === 'bengptGlobalVisits') {
        loadBengptVisits();
      } else if (e.key === 'jaisFunTheme') {
        loadTheme();
      }
    });
  </script>
</body>
</html>
